[workspace]
resolver = "2"
members = ["crates/zknbe-core", "crates/zknbe-server", "crates/zknbe-client"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
zknbe-core = { path = "crates/zknbe-core" }
zknbe-server = { path = "crates/zknbe-server" }

curve25519-dalek = { version = "4", features = ["digest", "rand_core", "zeroize"] }
ed25519-dalek = { version = "2", features = ["zeroize"] }
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
base64 = "0.22"
hex = "0.4"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive", "env"] }
ureq = { version = "2", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
axum = "0.7"
rusqlite = { version = "0.31", features = ["bundled"] }
ipnet = { version = "2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
